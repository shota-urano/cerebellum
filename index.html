<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>今日のタスク</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --ink: #1f2328; --sub: #6b7280;
    --line: #e5e2dc; --accent: #2f6f4f; --done-bg: #f0efec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --card: #1e2126; --ink: #e8e6e1; --sub: #8b909a;
      --line: #2c3037; --accent: #5fae87; --done-bg: #181a1e;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Hiragino Sans", sans-serif;
    max-width: 640px; margin: 0 auto;
    padding: max(16px, env(safe-area-inset-top)) 16px 48px;
  }
  header { display: flex; align-items: baseline; justify-content: space-between;
           padding: 8px 4px 16px; }
  h1 { font-size: 20px; font-weight: 700; }
  #count { color: var(--sub); font-size: 14px; font-variant-numeric: tabular-nums; }
  #list { display: flex; flex-direction: column; gap: 8px; }
  .task {
    display: flex; gap: 12px; align-items: flex-start; width: 100%;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px; font: inherit; color: inherit; text-align: left; cursor: pointer;
  }
  .task:active { transform: scale(.985); }
  .box {
    flex: none; width: 24px; height: 24px; margin-top: 1px;
    border: 2px solid var(--sub); border-radius: 7px;
    display: grid; place-items: center; color: transparent; font-size: 15px;
  }
  .meta { color: var(--sub); font-size: 12px; margin-bottom: 3px; }
  .body { font-size: 15px; line-height: 1.5; }
  .task.done { background: var(--done-bg); border-color: transparent; }
  .task.done .box { background: var(--accent); border-color: var(--accent); color: #fff; }
  .task.done .body { color: var(--sub); text-decoration: line-through; }
  #err { color: #b4453a; padding: 12px 4px; display: none; }
</style>

<header>
  <h1 id="title">今日のタスク</h1>
  <span id="count"></span>
</header>
<div id="err"></div>
<div id="list"></div>

<script>
const list = document.getElementById("list");

function render(data) {
  document.getElementById("title").textContent =
    `${data.date}（${data.weekday}）`;
  const done = data.tasks.filter(t => t.done).length;
  document.getElementById("count").textContent = `${done} / ${data.tasks.length}`;
  list.replaceChildren(...data.tasks.map(t => {
    const btn = document.createElement("button");
    btn.className = "task" + (t.done ? " done" : "");
    btn.onclick = () => toggle(t.id);
    const meta = [t.time, t.effort, t.tool !== "-" && t.tool].filter(Boolean).join(" · ");
    btn.innerHTML = `<span class="box">✓</span><span>` +
      (meta ? `<div class="meta"></div>` : "") + `<div class="body"></div></span>`;
    if (meta) btn.querySelector(".meta").textContent = meta;
    btn.querySelector(".body").textContent = t.content;
    return btn;
  }));
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

async function load() {
  try {
    render(await api("/api/tasks"));
    document.getElementById("err").style.display = "none";
  } catch (e) {
    const el = document.getElementById("err");
    el.textContent = "サーバーに繋がらない（server.py が起動してるか確認）";
    el.style.display = "block";
  }
}

async function toggle(id) {
  try {
    render(await api("/api/toggle", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({id}),
    }));
  } catch (e) { load(); }
}

load();
document.addEventListener("visibilitychange",
  () => { if (!document.hidden) load(); });
</script>
